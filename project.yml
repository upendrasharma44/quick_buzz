name: BuzzLight
options:
  bundleIdPrefix: com.upendrasharma
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    # DEVELOPMENT_TEAM comes from the git-ignored Config/Local.xcconfig (see Config/Base.xcconfig).

packages:
  BuzzCore:
    path: Packages/BuzzCore
  BuzzNetwork:
    path: Packages/BuzzNetwork

targets:
  BuzzLight:
    type: application
    platform: iOS
    sources:
      - path: App
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    dependencies:
      - package: BuzzCore
      - package: BuzzNetwork
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: BuzzLight
        # Driven by MARKETING_VERSION / CURRENT_PROJECT_VERSION below (bump those, not these).
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.trivia-games
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Only Apple's built-in TLS (Network.framework) is used, which is exempt. Confirm in
        # App Store Connect → App Information → Encryption.
        ITSAppUsesNonExemptEncryption: false
        # Required for Bonjour discovery (Network.framework) on iOS 14+.
        NSLocalNetworkUsageDescription: BuzzLight uses your local network to find nearby phones, so you can host or join a buzzer game with friends in the same room.
        NSBonjourServices:
          - _buzzlight._tcp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.upendrasharma.buzzlight
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        # iPhone only for v1.0; iPad layout is a Stage 4 item.
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  BuzzLightTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppTests
    dependencies:
      - target: BuzzLight

schemes:
  BuzzLight:
    build:
      targets:
        BuzzLight: all
    run:
      config: Debug
      # DEBUG-only demo mode (see docs/testing.md). Tick these in Edit Scheme → Arguments.
      commandLineArguments:
        "-BLDemo YES": false
        "-BLDebugLog YES": false
        "-BLDemoAutoPlay YES": false
        "-BLDemoAutoBuzz fast": false
        "-BLRoute host": false
        "-BLRoute join": false
        "-BLRoute join-first": false
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - BuzzLightTests
        - package: BuzzCore/BuzzCoreTests
        - package: BuzzNetwork/BuzzNetworkTests
